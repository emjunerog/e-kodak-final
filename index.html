<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function() {
        try {
          const path = window.location.pathname;
          // Admin portal is strictly light theme — never affected by photographer station
          if (path.startsWith('/admin')) {
            document.documentElement.classList.remove('dark');
            return;
          }

          // Photographer station portal
          if (path.startsWith('/photographer')) {
            const photoTheme = localStorage.getItem('ekodak_photographer_theme_mode');
            if (photoTheme === 'system') {
              const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
              if (prefersDark) {
                document.documentElement.classList.add('dark');
              } else {
                document.documentElement.classList.remove('dark');
              }
            } else if (photoTheme === 'light') {
              document.documentElement.classList.remove('dark');
            } else {
              // Default photographer station is dark
              document.documentElement.classList.add('dark');
            }

            const photoCompact = localStorage.getItem('ekodak_photographer_compactView');
            if (photoCompact !== null && (photoCompact === 'true' || JSON.parse(photoCompact) === true)) {
              document.documentElement.classList.add('compact-layout');
            }
            const photoMotion = localStorage.getItem('ekodak_photographer_motionEffects');
            if (photoMotion !== null && JSON.parse(photoMotion) === false) {
              document.documentElement.classList.add('reduce-motion');
            }
            return;
          }

          // Customer portal
          const darkPref = localStorage.getItem('ekodak_darkMode');
          if (darkPref === 'true' || (darkPref && JSON.parse(darkPref) === true)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
          const compactPref = localStorage.getItem('ekodak_compactView');
          if (compactPref !== null && (compactPref === 'true' || JSON.parse(compactPref) === true)) {
            document.documentElement.classList.add('compact-layout');
          }
        } catch (e) {
          document.documentElement.classList.remove('dark');
        }
      })();
    </script>
    <link rel="icon" type="image/png" href="/logo-mark.png" />
    <link rel="apple-touch-icon" href="/logo-mark.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO Meta Tags -->
    <meta
      name="description"
      content="Book professional photography sessions in Cebu. Portraits, graduations, events, and family sessions. Track your booking in real time."
    />
    <meta
      name="keywords"
      content="photography studio, book photographer, portrait photography, graduation photography, Cebu photographer"
    />
    <meta name="author" content="E-Kodak Photography Studio" />

    <!-- Open Graph (for social sharing previews) -->
    <meta property="og:title" content="E-Kodak | Professional Photography Studio" />
    <meta
      property="og:description"
      content="Professional photography services designed to preserve the moments that matter."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/og-image.jpg" />
    <meta property="og:url" content="https://ekodak.ph" />
    <meta property="og:site_name" content="E-Kodak Photography Studio" />

    <title>E-Kodak | Professional Photography Studio</title>

    <!-- Google Fonts: Playfair Display (editorial headings) + Inter (clean body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,500;1,700&family=Inter:wght@300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
