name: Build Android APK (Mobile App)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "mobile/**"
      - ".github/workflows/build-mobile-apk.yml"

permissions:
  contents: write

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Verify Android SDK & accept licenses
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=${SDK_ROOT}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${SDK_ROOT}" >> "$GITHUB_ENV"
          SDKMGR="$(command -v sdkmanager || ls "${SDK_ROOT}"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -n 1)"
          if [ -n "${SDKMGR}" ]; then
            yes | "${SDKMGR}" --sdk_root="${SDK_ROOT}" --licenses >/dev/null 2>&1 || true
          fi

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci

      - name: Write mobile env file from repository secrets (if provided)
        working-directory: mobile
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.EXPO_PUBLIC_GOOGLE_MAPS_API_KEY }}
        run: |
          cat <<EOF > .env
          EXPO_PUBLIC_SUPABASE_URL=${EXPO_PUBLIC_SUPABASE_URL}
          EXPO_PUBLIC_SUPABASE_ANON_KEY=${EXPO_PUBLIC_SUPABASE_ANON_KEY}
          EXPO_PUBLIC_GOOGLE_MAPS_API_KEY=${EXPO_PUBLIC_GOOGLE_MAPS_API_KEY}
          EOF

      - name: Generate Android native project (expo prebuild)
        working-directory: mobile
        env:
          CI: "1"
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build Android Release APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=armeabi-v7a,arm64-v8a

      - name: Rename installable APK
        run: |
          mkdir -p mobile-release
          cp mobile/android/app/build/outputs/apk/release/app-release.apk mobile-release/ekodak-companion.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ekodak-companion-apk
          path: mobile-release/ekodak-companion.apk
          retention-days: 30

      - name: Publish installable APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: companion-latest
          name: E-Kodak Companion Android App (Latest APK)
          body: |
            Direct installable Android APK for the **E-Kodak Studio Companion** mobile app (`com.ekodak.companion`).

            ### How to Install on Android
            1. Tap **`ekodak-companion.apk`** under **Assets** below to download.
            2. Open the downloaded `.apk` file on your Android phone.
            3. Allow **"Install unknown apps"** if prompted, then tap **Install**.
          files: mobile-release/ekodak-companion.apk
